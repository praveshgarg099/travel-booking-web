spring.application.name=travelBookingWeb

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/travel_booking}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD}}

spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.config.import=optional:classpath:application-local.properties

# CORS Configuration (Development Default: localhost Vite dev servers)
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,https://yatramigo.dev,https://www.yatramigo.dev,https://travel-booking-web.vercel.app

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=INR
razorpay.order.expiration-minutes=15

# Email Configuration (Spring Mail)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
mail.from.address=${MAIL_FROM:${MAIL_FROM_ADDRESS:}}
mail.from.name=Yatramigo

# Google OAuth2 Client Configuration
google.client.id=${GOOGLE_CLIENT_ID:}

# Environment & Security Configuration (Dev Defaults)
app.auth.allow-simulation=true
app.email.dev-otp-logging=true