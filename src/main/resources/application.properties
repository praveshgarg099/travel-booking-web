spring.application.name=travelBookingWeb

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/travel_booking}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD}}

spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.config.import=optional:classpath:application-local.properties

# CORS Configuration (Development Default: localhost Vite dev servers)
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=INR
razorpay.order.expiration-minutes=15