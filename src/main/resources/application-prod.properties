# ==============================================================================
# Travel Booking Web Application - Production Profile Configuration
# Activate via: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

spring.application.name=travelBookingWeb

# Server Port (read from PORT environment variable provided by Render/Railway/Heroku/Container)
server.port=${PORT:8080}

# Managed PostgreSQL Database Connection
# Supported patterns:
# 1) Full JDBC URL via SPRING_DATASOURCE_URL or DATABASE_URL:
#    jdbc:postgresql://<host>:<port>/<dbname>?sslmode=require
# 2) Disaggregated credentials via DB_USERNAME / DB_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Production Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA / Hibernate Production Settings
# Safe DDL strategy: validates existing schema and applies safe, non-destructive column additions.
# Note: For long-term enterprise migrations, a versioned migration tool like Flyway should be introduced.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & JWT Configuration (Must be passed as environment variables in production)
jwt.secret=${JWT_SECRET}

# Production CORS: Strictly restricted to the production frontend HTTPS origin
# Must be passed via FRONTEND_URL (e.g. https://your-travel-app.onrender.com)
# Localhost origins are EXCLUDED in this profile.
cors.allowed-origins=${FRONTEND_URL:https://yatramigo.dev,https://www.yatramigo.dev,https://travel-booking-web.vercel.app}

# Razorpay Payment Gateway (INR) Configuration
# Read strictly from production environment variables.
# NEVER commit credentials to source code.
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=INR
razorpay.order.expiration-minutes=15

# Response Compression (Improves network efficiency and user load times)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Google OAuth2 Production Configuration (Strict verification; simulation strictly forbidden)
google.client.id=${GOOGLE_CLIENT_ID:}
app.auth.allow-simulation=false

# Email Configuration (Production: Resend SMTP via SSL; zero console OTP logging)
spring.mail.host=${SPRING_MAIL_HOST:smtp.resend.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:resend}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.trust=smtp.resend.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
mail.from.address=${MAIL_FROM:no-reply@yatramigo.dev}
mail.from.name=Yatramigo
app.email.dev-otp-logging=false

